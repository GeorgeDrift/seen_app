name: seen_app
description: "Seen — Behavioral Annotation & Therapist System."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management (compile-time safe DI + AsyncValue for loading/error/data)
  flutter_riverpod: ^2.6.1

  # HTTP client with interceptors — used to attach the Azure Functions key
  # and to convert HTTP failures into typed Failure objects at the boundary.
  dio: ^5.7.0

  # UUIDs for locally-generated DailyEntry ids
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/cozy_reflection_header.png
    - assets/cozy_bedroom_scene.png
    - assets/figma_intro_background.png
    - assets/figma_loading_background.png
  fonts:
    - family: Lora
      fonts:
        - asset: assets/fonts/Lora-Variable.ttf
        - asset: assets/fonts/Lora-Italic-Variable.ttf
          style: italic
    - family: DMSans
      fonts:
        - asset: assets/fonts/DMSans-Variable.ttf
        - asset: assets/fonts/DMSans-Italic-Variable.ttf
          style: italic
