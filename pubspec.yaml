name: seen_app
description: "Seen — Behavioral Annotation & Therapist System."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management (compile-time safe DI + AsyncValue for loading/error/data)
  flutter_riverpod: ^2.6.1

  # HTTP client with interceptors — used to attach the Azure Functions key
  # and to convert HTTP failures into typed Failure objects at the boundary.
  dio: ^5.7.0

  # UUIDs for locally-generated DailyEntry ids
  uuid: ^4.5.1
  health: ^13.3.1
  device_calendar: ^4.3.3
  geolocator: ^14.0.2

  # Persists today's in-progress/completed entry across app restarts.
  shared_preferences: ^2.3.3

  # Renders the Figma-exported icon set for the Patterns screen.
  flutter_svg: ^2.0.10+1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.8
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/cozy_reflection_header.png
    - assets/cozy_evening_header.png
    - assets/cozy-completed-header.png
    - assets/cozy_bedroom_scene.png
    - assets/cozy_purple_bedroom_retreat.png
    - assets/cozy_plant_filled_bedroom_workspace.png
    - assets/cozy_sunlit_green_living_space.png
    - assets/rest_and_reset_map.json
    - assets/full_and_active_map.json
    - assets/open_and_steady_map.json
    - assets/figma_intro_background.png
    - assets/figma_loading_background.png
    - assets/icons/patterns/
  fonts:
    - family: Lora
      fonts:
        - asset: assets/fonts/Lora-Variable.ttf
        - asset: assets/fonts/Lora-Italic-Variable.ttf
          style: italic
    - family: DMSans
      fonts:
        - asset: assets/fonts/DMSans-Variable.ttf
        - asset: assets/fonts/DMSans-Italic-Variable.ttf
          style: italic

flutter_native_splash:
  color: "#bca2be"
  image: assets/splash_screen.png
  fullscreen: true
  web: false
  android_12:
    image: assets/logo.png
    icon_background_color: "#ffffff"

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo.png"
  remove_alpha_ios: true
  background_color_ios: "#ffffff"
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/logo.png"
